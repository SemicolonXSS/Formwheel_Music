<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Battle · Formwheel</title><link rel="icon" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg"><style>*{box-sizing:border-box}body{font:16px system-ui,sans-serif;margin:0;background:#f5f7fc;color:#26334c}header{padding:16px;background:#fff;border-bottom:1px solid #dfe5ee}a{color:#455cca;text-decoration:none}main{max-width:860px;margin:auto;padding:20px}section{background:#fff;border:1px solid #e0e5ef;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 15px #23355409}button{border:0;background:#4c62d0;color:white;border-radius:12px;padding:13px 18px;margin:4px;font:inherit;cursor:pointer}button:disabled{opacity:.45}input{border:1px solid #cbd3e2;padding:12px;border-radius:10px;font:inherit;max-width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{background:#eef2fd;border-radius:12px;padding:12px}.number{font-size:28px;font-weight:800}.arena{text-align:center;padding:20px 0}.giant{font-size:26px;min-height:110px;width:min(100%,450px)}#info{color:#697186}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wheel{font-size:60px;margin:20px}.track{height:75px;border:3px solid #98a7ce;border-radius:14px;position:relative;margin:26px 0;background:repeating-linear-gradient(90deg,#e6ecff,#e6ecff 32px,#f6f8ff 32px,#f6f8ff 64px)}#ball{position:absolute;top:15px;left:0;font-size:30px}.finish{position:absolute;right:0;top:14px;font-size:30px}.beat{font-size:65px;min-height:100px}#status{color:#854e18;white-space:pre-wrap}</style></head><body><header><a href="./index.html">← Music 일반 모드</a> · <a href="https://semicolonxss.github.io/Formwheel/">Formwheel Hub</a></header><main><h1>🎵 Music 리듬 배틀</h1><p>같은 박자에 맞춰 리듬 버튼을 누르세요. 정확한 타이밍일수록 높은 점수!</p><section id="join"><div class="row"><input id="nick" maxlength="14" placeholder="닉네임"><button id="create">방 만들기</button><input id="codeInput" maxlength="6" placeholder="방 코드 6자리"><button id="joinBtn">방 참가</button></div><p id="status">방 코드를 친구에게 알려주세요.</p></section><section id="roomSection" class="hidden"><div class="row"><b>방 코드: <span id="code"></span></b><button id="copy">코드 복사</button><button id="leave">나가기</button></div><div class="stats"><div class="stat">내 점수<div class="number" id="myPoints">0</div></div><div class="stat">상대 점수<div class="number" id="otherPoints">0</div></div><div class="stat">남은 시간<div class="number" id="timer"></div></div><p id="opponent">상대 대기 중…</p><button id="start" class="hidden">배틀 시작</button><p id="message"></p></section><section id="gameSection" class="hidden"><div class="arena"><h2>🎼 박자 맞추기</h2><div id="beat" class="beat">♪</div><button id="hit" class="giant">박자 맞춰 누르기 (스페이스)</button><p id="info">박자에 가까울수록 +100점</p></div></section></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getDatabase,ref,get,onValue,runTransaction}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
const app=initializeApp({"apiKey":"AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE","authDomain":"formwheel.firebaseapp.com","databaseURL":"https://formwheel-default-rtdb.firebaseio.com","projectId":"formwheel","appId":"1:431583088241:web:74e0e34ea1e3e1170c55d0"}),db=getDatabase(app),auth=getAuth(app),root="formwheelBattles/music",duration=120000;
const $=x=>document.getElementById(x),id=crypto.randomUUID();
let room=null,code="",unsub=null,busy=false,points=0,sent=-1,lastSent=0,finished=false;
const roomRef=c=>ref(db,root+"/"+c),nickname=()=>($("nick").value.trim().slice(0,14)||"플레이어");
async function authenticate(){if(!auth.currentUser)await signInAnonymously(auth)}
function error(e){$("status").textContent="연결 오류: "+(e.message||String(e));console.error(e)}
function remaining(){return room?.startedAt?Math.max(0,duration-(Date.now()-room.startedAt)):duration}
function running(){return room?.phase==="playing"&&remaining()>0}
function render(){if(!room)return;const players=Object.entries(room.players||{}),me=room.players?.[id],other=players.find(([k])=>k!==id)?.[1];$("code").textContent=code;$("opponent").textContent="나: "+(me?.name||"") +" · 상대: "+(other?.name||"참가 대기 중");$("myPoints").textContent=(me?.score||0).toLocaleString();$("otherPoints").textContent=(other?.score||0).toLocaleString();const seconds=Math.ceil(remaining()/1000);$("timer").textContent=Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");$("start").classList.toggle("hidden",room.host!==id||room.phase!=="waiting"||players.length!==2);$("gameSection").classList.toggle("hidden",room.phase!=="playing");if(room.phase==="waiting")$("message").textContent="2명이 모이면 방장이 시작할 수 있어요.";else if(room.phase==="playing")$("message").textContent="대결 진행 중!";else{const ordered=players.slice().sort((a,b)=>(b[1].score||0)-(a[1].score||0));$("message").textContent=ordered.length<2?"상대가 퇴장했어요.":ordered[0][1].score===ordered[1][1].score?"🤝 무승부":ordered[0][0]===id?"🏆 승리!":"상대 승리!";}}
function observe(c){unsub?.();code=c;$("join").classList.add("hidden");$("roomSection").classList.remove("hidden");unsub=onValue(roomRef(c),s=>{room=s.val();if(!room||!room.players?.[id]){alert("방이 종료되었거나 퇴장 처리되었습니다.");location.href="./index.html";return}render()},e=>$("message").textContent="실시간 연결 오류: "+e.message)}
$("create").onclick=async()=>{if(busy)return;busy=true;try{await authenticate();for(let i=0;i<6;i++){const c=Array.from(crypto.getRandomValues(new Uint8Array(6)),v=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[v%32]).join("");const tx=await runTransaction(roomRef(c),v=>v===null?{host:id,phase:"waiting",createdAt:Date.now(),players:{[id]:{name:nickname(),score:0}}}:undefined,{applyLocally:false});if(tx.committed){observe(c);return}}throw Error("방 생성 실패")}catch(e){error(e)}finally{busy=false}};
$("joinBtn").onclick=async()=>{if(busy)return;busy=true;try{await authenticate();const c=$("codeInput").value.replace(/\s|-/g,"").toUpperCase();if(!/^[A-Z0-9]{6}$/.test(c))throw Error("6자리 코드를 입력해주세요.");const target=roomRef(c),initial=(await get(target)).val();if(!initial)throw Error("방이 없어요. 코드를 확인해주세요.");if(initial.phase!=="waiting")throw Error("이미 시작했거나 종료된 방이에요.");if(Object.keys(initial.players||{}).length>=2)throw Error("방이 가득 찼어요.");const tx=await runTransaction(target,current=>{const v=current===null?initial:current;if(!v||v.phase!=="waiting"||!v.players||Object.keys(v.players).length>=2)return;return {...v,players:{...v.players,[id]:{name:nickname(),score:0}}}},{applyLocally:false});if(!tx.committed)throw Error("방 참가가 취소됐어요. 다시 시도해주세요.");observe(c)}catch(e){error(e)}finally{busy=false}};
$("start").onclick=async()=>{if(room?.host!==id||room.phase!=="waiting"||Object.keys(room.players||{}).length!==2)return;try{await runTransaction(roomRef(code),v=>{if(!v||v.phase!=="waiting"||v.host!==id||Object.keys(v.players||{}).length!==2)return;return {...v,phase:"playing",startedAt:Date.now()}},{applyLocally:false})}catch(e){$("message").textContent=e.message}};
$("leave").onclick=async()=>{try{await runTransaction(roomRef(code),v=>{if(!v||!v.players?.[id])return;const players={...v.players};delete players[id];if(!Object.keys(players).length)return null;return {...v,host:v.host===id?Object.keys(players)[0]:v.host,phase:v.phase==="playing"?"finished":v.phase,players}},{applyLocally:false})}finally{location.href="./index.html"}};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(code)}catch(e){prompt("방 코드",code)}};
async function sendScore(){if(!running()||points<=sent)return;const target=points;sent=target;lastSent=Date.now();try{await runTransaction(ref(db,root+"/"+code+"/players/"+id+"/score"),v=>Math.max(Number(v||0),target),{applyLocally:false})}catch(e){sent=-1;$("message").textContent="점수 동기화 실패: "+e.message}}
function scheduleSend(){if(Date.now()-lastSent>450)sendScore()}
const beatStart=()=>room?.startedAt||Date.now();document.getElementById("hit").onclick=()=>{if(!running())return;const phase=(Date.now()-beatStart())%750;const delta=Math.min(phase,750-phase);const award=delta<=90?100:delta<=180?60:delta<=280?20:0;points+=award;document.getElementById("info").textContent="타이밍 "+(award===100?"PERFECT":award===60?"GOOD":award===20?"OK":"MISS")+" · "+points+"점";scheduleSend()};document.addEventListener("keydown",e=>{if(e.code==="Space"&&!e.repeat&&room?.phase==="playing"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById("hit").click()}});setInterval(()=>{if(running())document.getElementById("beat").textContent=((Date.now()-beatStart())%750)<160?"🥁":"♪"},80);
setInterval(async()=>{if(!room)return;render();if(running()&&points>sent&&Date.now()-lastSent>=450)sendScore();if(room.phase==="playing"&&remaining()===0&&room.host===id){try{await runTransaction(roomRef(code),v=>{if(!v||v.phase!=="playing"||Date.now()<v.startedAt+duration)return;return {...v,phase:"finished"}},{applyLocally:false})}catch(e){$("message").textContent=e.message}}},300);
</script></body></html>
